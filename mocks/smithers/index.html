<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RED — one tap, all red</title>
<style>
  :root{
    --red:#e4002b;
    --ink:#160203;
    --paper:#fff4f1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    position:relative;
    height:100dvh;
    display:flex;
    flex-direction:column;
    max-width:460px;
    margin:0 auto;
    padding:26px 24px 34px;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(228,0,43,.10), transparent 60%),
      var(--paper);
    transition:background .5s ease, color .5s ease;
  }
  /* the RED state */
  .app.on{
    --paper:var(--red);
    color:#fff;
    background:
      radial-gradient(130% 90% at 50% -10%, #ff3d5e, var(--red) 55%, #a8001f 100%);
  }
  .app.on .brandmark{background:#fff;color:var(--red)}
  .app.on .tag{color:rgba(255,255,255,.85)}
  .app.on .knob{background:#fff;color:var(--red);box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .app.on .hint{color:rgba(255,255,255,.8)}
  .app.on .swatch{border-color:rgba(255,255,255,.5)}

  header{display:flex;align-items:center;gap:12px}
  .brandmark{
    width:38px;height:38px;border-radius:11px;
    background:var(--red);color:#fff;
    display:grid;place-items:center;
    font-weight:800;font-size:20px;letter-spacing:-1px;
    transition:.4s;
  }
  .word{font-weight:800;font-size:19px;letter-spacing:2px}
  .tag{margin-left:auto;font-size:11px;letter-spacing:2px;font-weight:700;
    text-transform:uppercase;color:var(--red);transition:.4s}

  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .pitch{
    font-size:clamp(38px,11vw,52px);
    line-height:.98;
    font-weight:800;
    letter-spacing:-1.5px;
  }
  .pitch em{font-style:normal;color:var(--red);transition:.4s}
  .app.on .pitch em{color:#fff;text-decoration:underline;text-decoration-thickness:4px}
  .sub{font-size:15px;max-width:30ch;opacity:.7;line-height:1.45}

  .dial{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:6px}
  .knob{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    width:150px;height:150px;border-radius:50%;
    background:var(--red);color:#fff;
    font-weight:800;font-size:22px;letter-spacing:1px;
    box-shadow:0 18px 46px rgba(228,0,43,.45);
    transition:transform .18s ease, box-shadow .5s, background .5s, color .5s;
  }
  .knob:active{transform:scale(.93)}
  .hint{font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
    color:var(--red);transition:.4s}
  .swatch{
    display:flex;gap:8px;justify-content:center;margin-top:4px;
    font-size:11px;letter-spacing:1px;font-weight:700;
  }
  .swatch span{padding:5px 10px;border:1.5px solid var(--red);border-radius:99px;transition:.4s}
</style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="brandmark">R</div>
      <div class="word">RED</div>
      <div class="tag" id="state">off</div>
    </header>

    <div class="hero">
      <div class="pitch">One tap.<br><em>All red.</em></div>
      <div class="sub">No settings. No feed. No blue. The world's most decisive app just does the one thing it promises.</div>
    </div>

    <div class="dial">
      <button class="knob" id="knob">GO RED</button>
      <div class="hint" id="hint">tap to commit</div>
      <div class="swatch">
        <span>#E4002B</span><span>MAX SATURATION</span><span>ZERO REGRET</span>
      </div>
    </div>
  </div>

<script>
  const app = document.getElementById('app');
  const knob = document.getElementById('knob');
  const state = document.getElementById('state');
  const hint = document.getElementById('hint');
  let on = false;
  knob.addEventListener('click', () => {
    on = !on;
    app.classList.toggle('on', on);
    knob.textContent = on ? 'RED' : 'GO RED';
    state.textContent = on ? 'ON' : 'off';
    hint.textContent = on ? 'you are now red' : 'tap to commit';
    if (on && navigator.vibrate) navigator.vibrate(30);
  });
</script>
</body>
</html>
